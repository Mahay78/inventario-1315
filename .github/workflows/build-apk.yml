name: Compilar APK Android (Release Oficial)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK de Android (Release Firmada)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        run: npm ci

      - name: Preparar carpeta web
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js www/ 2>/dev/null || true

      - name: Añadir y sincronizar plataforma Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configurar permisos de Cámara e Internet
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.CAMERA" "$MANIFEST"; then
            echo "Permisos ya existen."
          else
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' "$MANIFEST"
          fi

      - name: Permisos para Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Alinear y Firmar APK con Keystore Oficial (v1, v2, v3, v4)
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Usando Build Tools: $BUILD_TOOLS_DIR"
          
          # Zipalign
          $BUILD_TOOLS_DIR/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          
          # Firmar con apksigner oficial
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-key-alias controlarmario --ks-pass pass:controlarmario1315 --key-pass pass:controlarmario1315 --out Control_de_Armario_Pro_1315.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          
          # Verificar firma
          $BUILD_TOOLS_DIR/apksigner verify -v Control_de_Armario_Pro_1315.apk

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Control-de-Armario-Pro-1315-Release-APK
          path: Control_de_Armario_Pro_1315.apk
          retention-days: 30

      - name: Publicar Release con APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: Control_de_Armario_Pro_1315.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Control de Armario Pro v1.0.${{ github.run_number }} (Oficial)
          body: |
            ### 📱 APK Oficial Firmada (Release)
            Versión optimizada y firmada para producción lista para instalar en Android.
            
            - **Descarga:** Haz clic en **`Control_de_Armario_Pro_1315.apk`** adjunto abajo.
            - **Instalación:** Abre el archivo descargado e instálalo normalmente.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
